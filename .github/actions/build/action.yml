name: "🏗️ Build Site"
description: "Build the site for deployment"

inputs:
  github_token:
    description: "The GitHub token to use"
    required: true
  readeck_host:
    description: "Readeck instance base URL"
    required: true
  readeck_api_token:
    description: "Readeck API bearer token"
    required: true

runs:
  using: "composite"
  steps:
    # Set up Node.js environment
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    # Install dependencies
    - name: 🔧 Install Dependencies
      shell: bash
      run: npm ci

    # Build the site
    - name: 🏗️ Build Site
      shell: bash
      env:
        READECK_HOST: ${{ inputs.readeck_host }}
        READECK_API_TOKEN: ${{ inputs.readeck_api_token }}
      run: npm run build

    # Upload the public directory as an artifact
    - name: 📤 Upload Artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: public
