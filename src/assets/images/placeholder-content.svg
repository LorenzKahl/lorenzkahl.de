<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Platzhalterbild, Inhaltsbreite</title>
  <desc id="desc">Warmes Platzhalterbild im Seitenverhältnis 16:9 für Bildbeispiele im Fließtext.</desc>
  <defs>
    <linearGradient id="bg-content" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe1cb"/>
      <stop offset="100%" stop-color="#e3cfa9"/>
    </linearGradient>
    <pattern id="stripes-content" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#3a3630" stroke-opacity="0.05" stroke-width="18"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-content)"/>
  <rect width="1200" height="675" fill="url(#stripes-content)"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#3a3630" stroke-opacity="0.15"/>
  <g fill="#544c40" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="322" font-size="34">Platzhalterbild</text>
    <text x="600" y="366" font-size="18" fill="#924800" letter-spacing="0.05em">1200 × 675 · INHALTSBREITE</text>
  </g>
</svg>
