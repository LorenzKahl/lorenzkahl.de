<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Platzhalterbild, Breakout</title>
  <desc id="desc">Warmes Platzhalterbild im breiten Format für Breakout-Elemente, die über die Textspalte hinausragen.</desc>
  <defs>
    <linearGradient id="bg-breakout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d4b3"/>
      <stop offset="100%" stop-color="#d9b98c"/>
    </linearGradient>
    <pattern id="stripes-breakout" width="40" height="40" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#3a3630" stroke-opacity="0.06" stroke-width="18"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#bg-breakout)"/>
  <rect width="1600" height="700" fill="url(#stripes-breakout)"/>
  <rect x="0.5" y="0.5" width="1599" height="699" fill="none" stroke="#3a3630" stroke-opacity="0.15"/>
  <g fill="#544c40" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="800" y="335" font-size="38">Platzhalterbild</text>
    <text x="800" y="382" font-size="19" fill="#8e4632" letter-spacing="0.05em">1600 × 700 · BREAKOUT</text>
  </g>
</svg>
